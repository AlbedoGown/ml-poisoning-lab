[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ml-poisoning-lab"
version = "0.1.0"
description = "Воспроизводимая лаборатория подмены обучающих меток на синтетических данных"
requires-python = ">=3.11,<3.15"
dependencies = ["numpy>=2.2,<3", "scikit-learn>=1.6,<2", "matplotlib>=3.10,<4"]

[project.scripts]
ml-poisoning-lab = "ml_poisoning_lab.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
